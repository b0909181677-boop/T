<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰蘭德劇場手寫筆記本</title>
    <!-- 引入手寫風格字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --paper-color: #f4ecd8;
            --line-color: #dcd0b8;
            --accent-color: #8b7355;
            --text-color: #4a3728;
        }

        body {
            background-color: var(--paper-color);
            background-image: 
                radial-gradient(circle at 2px 2px, var(--line-color) 1px, transparent 0);
            background-size: 30px 30px;
            color: var(--text-color);
            font-family: 'Ma+Shan+Zheng', 'Noto+Sans+TC', cursive;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .handwritten {
            font-family: 'Ma+Shan+Zheng', cursive;
        }

        /* 筆記本容器 */
        .notebook-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fffef9;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--accent-color);
            position: relative;
        }

        .notebook-container::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            border-left: 2px dashed var(--accent-color);
            opacity: 0.3;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        /* 標籤頁排列 */
        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-button {
            background: var(--line-color);
            padding: 8px 15px;
            border-radius: 20px 20px 0 0;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--accent-color);
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .tab-button.active {
            background: #fffef9;
            border-bottom: 2px solid #fffef9;
            transform: translateY(2px);
            font-weight: bold;
        }

        /* 按鈕區域 */
        .content-area {
            border-top: 2px solid var(--accent-color);
            padding-top: 20px;
            min-height: 300px;
        }

        .buttons-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .drama-btn {
            background: white;
            border: 1.5px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.1s;
            box-shadow: 2px 2px 0px var(--accent-color);
            color: var(--text-color);
        }

        .drama-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--accent-color);
        }

        .add-action-btn {
            background: #e8f5e9;
            border: 1px dashed #4caf50;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #2e7d32;
        }

        .recommend-btn {
            background: #fff3e0;
            border: 1.5px solid #ff9800;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #e65100;
            font-weight: bold;
        }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #fffef9;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid var(--accent-color);
            position: relative;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line-color);
            font-family: inherit;
            font-size: 1.1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            color: var(--text-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-end;
        }

        .primary-btn {
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .danger-btn {
            background: #d32f2f;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .secondary-btn {
            background: #ff9800;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .tag-manager {
            margin-top: 40px;
            text-align: center;
            border-top: 1px dashed var(--accent-color);
            padding-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="notebook-container">
    <h1 class="handwritten">泰蘭德劇場</h1>

    <div id="tabs" class="tabs-container">
        <!-- 標籤按鈕 -->
    </div>

    <div class="content-area">
        <div id="buttonsGrid" class="buttons-grid">
            <!-- 劇名按鈕 -->
        </div>
    </div>

    <div class="tag-manager">
        <button onclick="randomRecommend()" class="recommend-btn">✨ 隨機推薦</button>
        <button onclick="addNewTag()" class="add-action-btn">+ 新增標籤</button>
        <button onclick="deleteCurrentTag()" class="danger-btn" style="background:#8b735544; color:#4a3728; border:1px solid #8b7355;">刪除此標籤</button>
    </div>
</div>

<!-- 筆記彈窗 -->
<div id="noteModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle" class="handwritten text-xl font-bold">編輯筆記</h2>
            <button onclick="closeModal()">✕</button>
        </div>
        <div id="dramaInfoFields">
            <div class="mb-4">
                <label class="block text-sm opacity-60">劇名：</label>
                <input id="editDramaName" type="text" class="w-full bg-transparent border-b border-gray-300 focus:outline-none text-lg">
            </div>
            <div id="tagDisplayField" class="mb-4 hidden">
                <label class="block text-sm opacity-60">標籤 (CP)：</label>
                <div id="displayTagName" class="text-lg font-bold text-orange-700"></div>
            </div>
            <label class="block text-sm opacity-60">心得筆記：</label>
        </div>
        <textarea id="noteContent" placeholder="寫下你的感想..."></textarea>
        
        <!-- 編輯模式按鈕 -->
        <div id="editModeFooter" class="btn-group">
            <button onclick="deleteDrama()" class="danger-btn">刪除此劇</button>
            <button onclick="saveNote()" class="primary-btn">儲存</button>
        </div>

        <!-- 推薦模式按鈕 -->
        <div id="recommendModeFooter" class="btn-group hidden">
            <button onclick="randomRecommend()" class="secondary-btn">✨ 再選一次</button>
            <button onclick="closeModal()" class="primary-btn">了解了</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'thailand_drama_notes_v37'; 
    const p10lNote = "嗯...好笑的喜劇。但人設不太好...佛布CP依舊很甜";
    const heartbeatNote = "當紅愛豆跟助理導演的愛情故事\n細水長流的感覺，穩穩平平的很甜";

    // 完整的預設數據結構
    const notebookDataTemplate = {
        "Off&Gun": [
            { name: "我們的天空", note: "在第一集出場；是一個靈魂互換相互理解的小番外" },
            { name: "愛情理論/戀愛傳播學", note: "(有特別篇)經典校園虐戀~\n前期虐滾寶後期虐關大爺；全程虐觀眾。\n10分!!\n刷了好幾次了~就喜歡又甜又虐演技在線的戲啦~" },
            { name: "他不是我/Not Me", note: "黑暗、寫實、社會議題導向的硬派BL，堪稱泰BL史上最具深度與社會批判力的一部，可惜不是我喜歡的風格但不錯看。\n7分~\n槍爺超帥 小白好甜 Gun演技真的超猛!" },
            { name: "Cooking Crush", note: "整體風格輕鬆療癒、滿滿OffGun的經典互動：Gun的傲嬌可愛、Off的溫柔霸道，笑點密集、甜度爆表，適合想放鬆追的觀眾。雖然有些人覺得劇情後半稍亂或時間跳躍(有點尬)，但OffGun化學反應依舊炸裂，食物鏡頭拍得讓人流口水可無聊當下飯劇。\n8分~" },
            { name: "實習生愛情", note: "辦公室戀愛 實習生 × 前輩導師\n職場成長 / 療癒、輕鬆喜劇、甜寵互動、實習生聯盟、副CP甜線 (GL+BL) \n7分...\n挺搞笑 但感情線沒有寫多好，尤其是小海的bg戲份!!女的人設超爛...。\n最後OFF突然消失留學五年才回來就結束了...閃電完結的摸不著頭腦>w<" },
            { name: "怠倦症候群", note: "正歷經創作瓶頸的年輕藝術家Jira在倦怠酒吧遇見了英俊的技術員Pheem..." }
        ],
        "Tay&New": [
            { name: "我們的天空", note: "第四集出場~\n妞利用厄運的藉口帶著呆各種玩了一天!超搞笑的OWO" },
            { name: "深藍之吻", note: "5分~\n有狗血的第三者綠茶情節" },
            { name: "櫻桃魔法", note: "8分!\n日漫改編得很成功!超純情的戀愛~~~" }
        ],
        "Pound&Phwin": [
            { name: "天上的魚/戀上天空魚", note: "8分~\n他們的BL出道作，輕鬆搞笑校園戀" },
            { name: "只為你一人/Never Let Me Go", note: "7分~\n保鏢×少爺!!!" },
            { name: "We Are/相愛的我們", note: "9分!\n大型群像甜寵大學BL" },
            { name: "Me and Thee/冷靜點!Thee先生", note: "8分\n小麵包本色出演!超顛的肥皂劇霸總!" }
        ],
        "Joong&Dunk": [
            { name: "Star in My Mind/腦海中的星辰", note: "7分~\n小蛋好奶好可愛~" },
            { name: "隱愛議程", note: "8分!\n蛋喜歡的女生是冏前任，於是為了追妹子蛋就找了冏教學~" },
            { name: "愛情獵殺/The Heart Killers", note: "8分!\n雙CP的四人都好養眼!" },
            { name: "Dare You to Death", note: "(驚悚/懸疑BL 下屬X上司)" }
        ],
        "Boun&Prem": [
            { name: "待到重逢時(副CP)", note: "10分!!\n主線是FlukeOhm，但看到文總的Win超級喜歡的!" },
            { name: "我們之間/Between Us", note: "9分!\n《待到重逢時》的官方番外/前傳" }
        ],
        "Earth&Mix": [
            { name: "千星傳說", note: "9分!!\n垂直入坑球慧的劇!" },
            { name: "月光雞油飯", note: "6分\n慧慧開場爆擊!超好看~" },
            { name: "大叔的愛", note: "5分\n日漫改編的職場搞笑顛劇" }
        ],
        "Ohm&Nanon": [
            { name: "兩小無拆/Just Friends?", note: "10分!!經典呀~~~" },
            { name: "我們的天空2", note: "在後面出現兩小的番外" }
        ],
        "Force&Book": [
            { name: "誰是我那個他/Enchanté", note: "還沒看" },
            { name: "A Boss and a Babe/我的寶貝老闆", note: "8分!\n實習生×老闆" },
            { name: "Only Friends/禁忌摯友", note: "貴圈真亂但刺激" },
            { name: "Perfect 10 Liners/男神俱樂部", note: p10lNote },
            { name: "秘密旋律", note: "一部懸疑劇情劇" }
        ],
        "Aou&Boom": [
            { name: "We Are/相愛的我們", note: "大型群像大學BL\n年下ㄟ~超香的狗姊組合!" },
            { name: "Perfect 10 Liners/男神俱樂部", note: p10lNote },
            { name: "Only Friends: Dream On", note: "群像劇 令人害怕的主役劇" }
        ],
        "Jimmy&Sea": [
            { name: "反之亦愛/Vice Versa", note: "8分!\n編劇腦洞超開!是魂穿的穿越劇~" },
            { name: "不曾遺忘的暮色/Last Twilight", note: "7分\n細水長流的感情線 挺治癒的" },
            { name: "親愛的占卜師/My Magic Prophecy", note: "9分!\n吉米簡使放飛自我超搞笑也超治癒~" }
        ],
        "First&Khaotung": [
            { name: "以愛為蝕/The Eclipse", note: "7分\n不錯!主懸疑推理向" },
            { name: "The Heart Killers/愛情獵殺", note: "殺手與警察線人!" },
            { name: "以貓飼愛", note: "討厭貓咪的Lynx在母親過世後..." }
        ],
        "Gemini&Fourth": [
            { name: "My School President/我的會長男友", note: "7分" },
            { name: "消失的初戀", note: "6分\n日漫改編" }
        ],
        "Perth&Chimon": [
            { name: "危險羅曼史/Dangerous Romance", note: "7分\n兩人顏值演技都在線!" }
        ],
        "William&Est": [
            { name: "心跳節拍", note: heartbeatNote },
            { name: "Me and Thee/冷靜點!Thee先生(副CP)", note: "意外嗑到威廉與小鯊魚的少爺保鑣組合>w<" }
        ],
        "Mile&Apo": [
            { name: "黑幫少爺愛上我", note: "10分!!!\n大人愛情！" }
        ],
        "福桃": [
            { name: "Love in the Air(愛在空氣中)", note: "9分\n福福的總裁 桃桃的男大" },
            { name: "海洋之戀/Love Sea", note: "7分\n桃桃的作家好精緻!" }
        ],
        "其他": [
            { name: "靈魂重生", note: "9分\n肯南平!肯超級帥的!" },
            { name: "愛的香氣", note: "建築師Jom穿越的故事。" },
            { name: "待到重逢時", note: "10分\n經典中的經典。" }
        ]
    };

    let notebookData = JSON.parse(localStorage.getItem(STORAGE_KEY));
    
    // 初始化或更新邏輯
    if (!notebookData) {
        notebookData = notebookDataTemplate;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notebookData));
    } else {
        // 更新特定內容
        Object.keys(notebookData).forEach(tag => {
            notebookData[tag].forEach(drama => {
                // 更新心跳節拍
                if (drama.name === "心跳節拍") {
                    drama.note = heartbeatNote;
                }
                // 統一更新男神俱樂部筆記
                if (drama.name === "Perfect 10 Liners/男神俱樂部") {
                    drama.note = p10lNote;
                }
            });
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notebookData));
    }

    let currentTag = "Off&Gun"; 
    let editingDramaIndex = -1;

    function init() {
        renderTabs();
        renderButtons();
    }

    function renderTabs() {
        const tabsDiv = document.getElementById('tabs');
        tabsDiv.innerHTML = '';
        Object.keys(notebookData).forEach(tag => {
            const btn = document.createElement('div');
            btn.className = `tab-button ${tag === currentTag ? 'active' : ''}`;
            btn.innerText = tag;
            btn.onclick = () => {
                currentTag = tag;
                renderTabs();
                renderButtons();
            };
            tabsDiv.appendChild(btn);
        });
    }

    function renderButtons() {
        const grid = document.getElementById('buttonsGrid');
        grid.innerHTML = '';
        const dramas = notebookData[currentTag] || [];
        dramas.forEach((drama, index) => {
            const btn = document.createElement('button');
            btn.className = 'drama-btn';
            btn.innerText = drama.name;
            btn.onclick = () => openModal(index);
            grid.appendChild(btn);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'add-action-btn';
        addBtn.innerText = '+ 新增劇目';
        addBtn.onclick = () => openModal(-1);
        grid.appendChild(addBtn);
    }

    function openModal(index) {
        editingDramaIndex = index;
        const modal = document.getElementById('noteModal');
        const titleInput = document.getElementById('editDramaName');
        const contentArea = document.getElementById('noteContent');
        const tagField = document.getElementById('tagDisplayField');
        const editFooter = document.getElementById('editModeFooter');
        const recommendFooter = document.getElementById('recommendModeFooter');
        
        tagField.classList.add('hidden');
        editFooter.classList.remove('hidden');
        recommendFooter.classList.add('hidden');
        titleInput.disabled = false;
        contentArea.readOnly = false;

        if (index === -1) {
            titleInput.value = '';
            contentArea.value = '';
            document.getElementById('modalTitle').innerText = '新增劇目';
        } else {
            const data = notebookData[currentTag][index];
            titleInput.value = data.name;
            contentArea.value = data.note || '';
            document.getElementById('modalTitle').innerText = '編輯筆記';
        }
        modal.style.display = 'flex';
    }

    function randomRecommend() {
        const allDramas = [];
        Object.keys(notebookData).forEach(tag => {
            notebookData[tag].forEach(drama => {
                allDramas.push({ ...drama, tag: tag });
            });
        });

        if (allDramas.length === 0) return;

        const randomIndex = Math.floor(Math.random() * allDramas.length);
        const recommend = allDramas[randomIndex];

        const modal = document.getElementById('noteModal');
        const titleInput = document.getElementById('editDramaName');
        const contentArea = document.getElementById('noteContent');
        const tagField = document.getElementById('tagDisplayField');
        const tagDisplay = document.getElementById('displayTagName');
        const editFooter = document.getElementById('editModeFooter');
        const recommendFooter = document.getElementById('recommendModeFooter');

        document.getElementById('modalTitle').innerText = '✨ 今日隨機推薦';
        titleInput.value = recommend.name;
        titleInput.disabled = true;
        tagField.classList.remove('hidden');
        tagDisplay.innerText = recommend.tag;
        contentArea.value = recommend.note || '(暫無簡介)';
        contentArea.readOnly = true;
        editFooter.classList.add('hidden');
        recommendFooter.classList.remove('hidden');

        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('noteModal').style.display = 'none';
    }

    function saveNote() {
        const name = document.getElementById('editDramaName').value.trim();
        const note = document.getElementById('noteContent').value;
        if (!name) return;

        if (editingDramaIndex === -1) {
            notebookData[currentTag].push({ name, note });
        } else {
            notebookData[currentTag][editingDramaIndex] = { name, note };
        }
        saveToLocalStorage();
        renderButtons();
        closeModal();
    }

    function deleteDrama() {
        if (editingDramaIndex === -1) { closeModal(); return; }
        if (confirm('確定刪除紀錄嗎？')) {
            notebookData[currentTag].splice(editingDramaIndex, 1);
            saveToLocalStorage();
            renderButtons();
            closeModal();
        }
    }

    function addNewTag() {
        const name = prompt('新標籤名稱：');
        if (name && !notebookData[name]) {
            notebookData[name] = [];
            currentTag = name;
            saveToLocalStorage();
            renderTabs(); renderButtons();
        }
    }

    function deleteCurrentTag() {
        if (confirm(`刪除「${currentTag}」及其內容？`)) {
            delete notebookData[currentTag];
            currentTag = Object.keys(notebookData)[0] || "其他";
            saveToLocalStorage();
            renderTabs(); renderButtons();
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notebookData));
    }

    window.onclick = e => { if (e.target.id === 'noteModal') closeModal(); }
    init();
</script>
</body>
</html>
